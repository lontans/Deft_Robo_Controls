[project]
name = "deft-controls-sdk"
version = "0.1.0"
description = "USB host SDK for the Deft Robotics controls PCB"
readme = "scripts/deft_controls_sdk/README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["deft_controls_sdk*"]
